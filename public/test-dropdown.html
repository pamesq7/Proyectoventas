<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dropdown</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Test de Dropdown</h2>
        
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-info">🎨 En Diseño</span>
            <div class="dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle p-1" 
                        type="button" 
                        id="dropdownTest" 
                        data-bs-toggle="dropdown" 
                        aria-expanded="false">
                    <i class="fas fa-edit"></i>
                </button>
                <ul class="dropdown-menu" aria-labelledby="dropdownTest">
                    <li><a class="dropdown-item" href="#">🎨 En Diseño</a></li>
                    <li><a class="dropdown-item" href="#">⚙️ Producción</a></li>
                    <li><a class="dropdown-item" href="#">✅ Terminado</a></li>
                    <li><a class="dropdown-item" href="#">📦 Entregado</a></li>
                    <li><a class="dropdown-item" href="#">❌ Cancelado</a></li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        console.log('jQuery:', typeof $);
        console.log('Bootstrap:', typeof bootstrap);
    </script>
</body>
</html>
